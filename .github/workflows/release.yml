name: Release

# Push a tag like v0.2.0 to build and publish the Mac client and Windows server.
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  client:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal DisplayWire.app
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p displaywire-client --target $t
          done
          mkdir -p dist
          lipo -create -output dist/displaywire-client \
            target/aarch64-apple-darwin/release/displaywire-client target/x86_64-apple-darwin/release/displaywire-client
          scripts/bundle-mac.sh dist/displaywire-client dist
          ditto -c -k --keepParent dist/DisplayWire.app dist/DisplayWire-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client
          path: dist/DisplayWire-macos.zip

  server:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build server
        shell: pwsh
        run: |
          cargo build --release -p displaywire-server -p netprobe
          New-Item -ItemType Directory dist/displaywire-server-windows | Out-Null
          Copy-Item target/release/displaywire-server.exe, target/release/netprobe.exe, README.md dist/displaywire-server-windows/
          Compress-Archive dist/displaywire-server-windows dist/displaywire-server-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/displaywire-server-windows.zip

  publish:
    needs: [client, server]
    runs-on: ubuntu-latest
    # The signing key is only available to this environment, which only runs for v* tags.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" || { echo "tag $GITHUB_REF_NAME does not match the version in Cargo.toml"; exit 1; }
          cargo run --release -p dwsign -- release "$version" dist/DisplayWire-macos.zip dist/displaywire-server-windows.zip dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/DisplayWire-macos.zip dist/displaywire-server-windows.zip dist/latest.txt dist/latest.txt.sig
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
