[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "server", "client"]

[workspace.package]
edition = "2024"
version = "0.4.0"

[workspace.dependencies]
proto = { path = "crates/proto" }
timing = { path = "crates/timing" }
transport = { path = "crates/transport" }
secure = { path = "crates/secure" }
xfer = { path = "crates/xfer" }
hevc = { path = "crates/hevc" }
videotoolbox = { path = "crates/videotoolbox" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
