[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "server", "client"]

[workspace.package]
edition = "2024"
version = "0.7.0"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Low-latency game streaming from a Windows PC (NVIDIA) to a Mac"
repository = "https://github.com/FragAverage/displaywire"
publish = false

[workspace.dependencies]
proto = { path = "crates/proto" }
timing = { path = "crates/timing" }
transport = { path = "crates/transport" }
secure = { path = "crates/secure" }
pairing = { path = "crates/pairing" }
update = { path = "crates/update" }
xfer = { path = "crates/xfer" }
hevc = { path = "crates/hevc" }
videotoolbox = { path = "crates/videotoolbox" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
