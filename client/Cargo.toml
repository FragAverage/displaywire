[package]
name = "displaywire-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
proto.workspace = true
timing.workspace = true
transport.workspace = true
secure.workspace = true
pairing.workspace = true
update.workspace = true
xfer.workspace = true
if-addrs = "0.13"
hevc.workspace = true
clap = { version = "4.6.7", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
videotoolbox.workspace = true
winit = "0.30"
cpal = "0.18"
rtrb = "0.4"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-game-controller = "0.3"
objc2-core-haptics = "0.3"

[target.'cfg(windows)'.dependencies]
winit = "0.30"
cpal = "0.18"
rtrb = "0.4"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_XboxController",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
