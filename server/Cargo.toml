[package]
name = "displaywire-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The device-management window is always built on Windows; this builds it elsewhere too, for development.
ui-dev = ["dep:eframe"]

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"], optional = true }
proto.workspace = true
timing.workspace = true
transport.workspace = true
secure.workspace = true
xfer.workspace = true
update.workspace = true
hevc.workspace = true
rtrb = "0.4"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
videotoolbox.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-media = "0.3"
objc2-screen-capture-kit = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts"] }
windows-core = "0.62"
moq-nvenc = "0.1"
# DS4 targets and Xbox rumble notifications are behind these features.
vigem-client = { version = "0.1.4", features = ["unstable_ds4", "unstable_xtarget_notification"] }
windows = { version = "0.62.2", features = [
  "Win32_Devices_Display",
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com_StructuredStorage",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_Media",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Environment",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_StationsAndDesktops",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
